apiVersion: 1
contactPoints:
  - orgId: 1
    name: pico-notify
    receivers:
      - uid: pico-slack
        type: slack
        settings:
          url: ${PICO_SLACK_WEBHOOK}
          title: '{{ if gt (len .Alerts.Firing) 0 }}🔋 Battery REALLY FULL{{ else }}Battery no longer full{{ end }}'
          text: |
            {{ range .Alerts.Firing }}✅ {{ .Annotations.summary }}
            {{ end }}{{ range .Alerts.Resolved }}↩️ Battery left the "really full" state (charging resumed or discharging).
            {{ end }}
        disableResolveMessage: false
